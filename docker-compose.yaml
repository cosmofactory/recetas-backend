services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    image: ghcr.io/cosmofactory/recetas-backend:local
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-recetas}:${POSTGRES_PASSWORD:-recetas_dev}@database:5432/${POSTGRES_DB:-recetas}?sslmode=disable
      HTTP_ADDR: ":8080"
      DB_MAX_CONNS: ${DB_MAX_CONNS:-}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-}
      LOGFIRE_TOKEN: ${LOGFIRE_TOKEN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-recetas-backend}
    ports:
      - "${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-recetas}
      POSTGRES_USER: ${POSTGRES_USER:-recetas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recetas_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_HOST_PORT:-5435}:5432"
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
