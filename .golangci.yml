version: "2"

linters:
  default: none
  enable:
    - errcheck
    - funlen
    - gosec
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused
  exclusions:
    generated: strict
    paths:
      - internal/catalog/catalogdb
      - internal/api/apigen
    rules:
      # Test functions hold long case tables; the reviewer checks test logic.
      - path: _test\.go
        linters:
          - funlen
  settings:
    # Clean-code limits from the root CLAUDE.md.
    funlen:
      lines: 30
      statements: -1
      ignore-comments: true
    revive:
      enable-default-rules: true
      rules:
        # Internal service, not a library: doc comments on every export are noise.
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: argument-limit
          arguments: [4]
        - name: max-control-nesting
          arguments: [2]
