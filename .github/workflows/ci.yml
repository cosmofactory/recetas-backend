name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Every setup-go step reads go.mod, so CI runs the `toolchain` patch release,
# the same one as the digest-pinned builder image in the Dockerfile.
env:
  GOOSE_VERSION: "v3.29.0"
  GOLANGCI_LINT_VERSION: "v2.15.0"
  SQLC_CLI_VERSION: "1.31.1" # keep in sync with SQLC_VERSION in the Makefile
  VACUUM_CLI_VERSION: "0.30.6" # keep in sync with VACUUM_VERSION in the Makefile
  GOVULNCHECK_VERSION: "v1.9.0" # keep in sync with GOVULNCHECK_VERSION in the Makefile
  IMAGE: ghcr.io/cosmofactory/recetas-backend
  DEMO_URL: https://demo.asadorov.es

jobs:
  lint-and-vet:
    name: Lint And Vet
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Go build
        run: go build ./...

      # Prebuilt sqlc binary: building it with go run takes minutes in CI.
      - name: Set up sqlc
        uses: sqlc-dev/setup-sqlc@v5
        with:
          sqlc-version: ${{ env.SQLC_CLI_VERSION }}

      - name: Generated code is up to date
        run: |
          make generate SQLC=sqlc
          git diff --exit-code
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            echo "Untracked files after make generate:" >&2
            echo "$untracked" >&2
            exit 1
          fi

      # Prebuilt vacuum release: go run builds it from source (~3 min).
      - name: Install vacuum
        run: |
          v="${VACUUM_CLI_VERSION}"
          base="https://github.com/daveshanley/vacuum/releases/download/v${v}"
          curl -fsSLo vacuum.tgz "${base}/vacuum_${v}_linux_x86_64.tar.gz"
          curl -fsSLo checksums.txt "${base}/checksums.txt"
          grep " vacuum_${v}_linux_x86_64.tar.gz$" checksums.txt | sed 's/vacuum_.*/vacuum.tgz/' | sha256sum -c -
          tar -xzf vacuum.tgz -C "$RUNNER_TEMP" vacuum
          rm vacuum.tgz checksums.txt

      - name: Lint OpenAPI spec
        run: make api-lint VACUUM="$RUNNER_TEMP/vacuum"

      # actionlint (with shellcheck) from the digest-pinned image, as in recetas-infra.
      - name: Lint workflows
        run: make lint-actions

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: recetas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recetas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: local
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/recetas_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/recetas_test?sslmode=disable
      HTTP_ADDR: ":8080"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@${{ env.GOOSE_VERSION }}

      - name: Apply migrations
        run: goose -dir db/migrations postgres "$DATABASE_URL" up

      - name: Run tests
        run: go test -race -count=1 ./...

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Fails only on vulnerabilities in code the module actually calls.
      - name: govulncheck
        run: make vulncheck GOVULNCHECK_VERSION="${GOVULNCHECK_VERSION}"

  image:
    name: Build, Scan And Push Image
    runs-on: ubuntu-latest
    needs:
      - lint-and-vet
      - test
      - vulncheck
    permissions:
      contents: read
      packages: write
    outputs:
      sha-tag: ${{ steps.tags.outputs.sha-tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Immutable tags only (sha-<7>, and vX.Y.Z for git tags); no :latest.
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          sha_tag="sha-${GITHUB_SHA::7}"
          version="$sha_tag"
          tags="${IMAGE}:${sha_tag}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            tags="${tags}"$'\n'"${IMAGE}:${GITHUB_REF_NAME}"
          fi
          {
            echo "sha-tag=${sha_tag}"
            echo "version=${version}"
            echo "ref=${IMAGE}:${sha_tag}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built once and loaded into the runner's Docker; the scans below and
      # the push all use this image.
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pinned by commit: trivy-action tags were force-pushed in 2026. Only
      # fixable CRITICAL findings fail, so an unfixed upstream CVE doesn't
      # block every PR.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tags.outputs.ref }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Checks the stdlib and dependencies compiled into the shipped binaries.
      - name: govulncheck the image binaries
        run: make vulncheck-image IMAGE_REF="${{ steps.tags.outputs.ref }}" GOVULNCHECK_VERSION="${GOVULNCHECK_VERSION}"

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push backend image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< "$TAGS"

  # Only main deploys, and only once the VM exists (DEPLOY_ENABLED, as in
  # recetas-infra). The demo environment's key is restricted on the VM to
  # ssh-gate.sh, which runs nothing but deploy-service.sh for the backend on
  # demo; that script rolls back and exits non-zero when the new image isn't
  # healthy, and keeps the failed container's logs on the VM.
  deploy-demo:
    name: Deploy Demo
    runs-on: ubuntu-latest
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    environment:
      name: demo
      url: ${{ env.DEMO_URL }}
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    # No checkout and no GitHub API calls: the token needs no scopes.
    permissions: {}
    # Covers the VM-side deploy lock wait (15 min) plus the health wait.
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      SSH_CONNECT_TIMEOUT_SECONDS: "20"
      SMOKE_ATTEMPTS: "10"
      SMOKE_RETRY_DELAY_SECONDS: "6"
      SMOKE_REQUEST_TIMEOUT_SECONDS: "10"

    steps:
      - name: Write SSH key and known hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          SSH_DIR="$RUNNER_TEMP/ssh"
          echo "SSH_DIR=$SSH_DIR" >> "$GITHUB_ENV"
          install -d -m 700 "$SSH_DIR"
          install -m 600 /dev/null "$SSH_DIR/key"
          install -m 600 /dev/null "$SSH_DIR/known_hosts"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"

      # ssh-gate.sh lets only this command through (and execs it without a shell).
      - name: Deploy the image to demo
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          IMAGE_TAG: ${{ needs.image.outputs.sha-tag }}
        run: |
          ssh -i "$SSH_DIR/key" \
            -o IdentitiesOnly=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout="$SSH_CONNECT_TIMEOUT_SECONDS" \
            "$SSH_USER@$SSH_HOST" "/srv/recetas/scripts/deploy-service.sh demo backend $IMAGE_TAG"

      # /readyz is the frontend route that asks the backend's /healthz (the API
      # itself isn't public). Retries cover Caddy and the frontend's upstream
      # settling after the backend container was recreated.
      - name: Smoke test demo
        run: |
          smoke() {
            local url=$1 attempt
            for ((attempt = 1; attempt <= SMOKE_ATTEMPTS; attempt++)); do
              if curl -fsSL -o /dev/null --max-time "$SMOKE_REQUEST_TIMEOUT_SECONDS" "$url"; then
                echo "ok: $url"
                return 0
              fi
              echo "attempt $attempt/$SMOKE_ATTEMPTS failed: $url" >&2
              if ((attempt < SMOKE_ATTEMPTS)); then sleep "$SMOKE_RETRY_DELAY_SECONDS"; fi
            done
            return 1
          }
          smoke "$DEMO_URL/"
          smoke "$DEMO_URL/readyz"

      - name: Remove SSH key
        if: always()
        run: rm -rf "${SSH_DIR:-$RUNNER_TEMP/ssh}"
