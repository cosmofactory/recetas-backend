name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GO_VERSION: "1.25"
  GOOSE_VERSION: "v3.24.0"
  GOLANGCI_LINT_VERSION: "v2.12.2"
  IMAGE: ghcr.io/cosmofactory/recetas-backend

jobs:
  lint-and-vet:
    name: Lint And Vet
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

      - name: Go build
        run: go build ./...

      - name: Generated code is up to date
        run: |
          make generate
          git diff --exit-code
          untracked=$(git ls-files --others --exclude-standard)
          if [ -n "$untracked" ]; then
            echo "Untracked files after make generate:" >&2
            echo "$untracked" >&2
            exit 1
          fi

      - name: Lint OpenAPI spec
        run: make api-lint

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: recetas_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recetas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: local
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/recetas_test?sslmode=disable
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/recetas_test?sslmode=disable
      HTTP_ADDR: ":8080"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install goose
        run: go install github.com/pressly/goose/v3/cmd/goose@${{ env.GOOSE_VERSION }}

      - name: Apply migrations
        run: goose -dir db/migrations postgres "$DATABASE_URL" up

      - name: Run tests
        run: go test -race -count=1 ./...

  build-and-push-image:
    name: Build And Push Image
    runs-on: ubuntu-latest
    needs:
      - lint-and-vet
      - test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Immutable tags only (sha-<7>, and vX.Y.Z for git tags); no :latest.
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          sha_tag="sha-${GITHUB_SHA::7}"
          version="$sha_tag"
          tags="${IMAGE}:${sha_tag}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
            tags="${tags}"$'\n'"${IMAGE}:${GITHUB_REF_NAME}"
          fi
          {
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            VERSION=${{ steps.tags.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
